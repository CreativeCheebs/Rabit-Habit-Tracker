<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabit - Habit and Goals Tracker</title>
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/PlusJakartaSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="tip" role="tooltip"></div>
<div class="desk" id="desk" style="display:none">
<aside class="side">
<div class="brand"><img class="brand-mark" src="icon-192.png" alt=""><div><b>Rabit</b><small id="brandSub">Desktop</small></div></div>
<nav class="sidenav" aria-label="Main navigation">
<button type="button" class="active" data-view="runs" aria-current="page"><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0M9 12l2 2 4-4"/></svg></span><span class="lbl">Today</span></button>
<button type="button" data-view="analytics" hidden><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></svg></span><span class="lbl">Stats</span></button>
<button type="button" data-view="goals"><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0M6 12a6 6 0 1 0 12 0a6 6 0 1 0-12 0M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0"/></svg></span><span class="lbl">Goals</span></button>
<button type="button" data-view="trackers" hidden><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m22 7-8.5 8.5-5-5L2 17M16 7h6v6"/></svg></span><span class="lbl">Trackers</span></button>
<button type="button" data-view="quicklog" hidden><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg></span><span class="lbl">Quick Log</span></button>
<button type="button" data-view="settings"><span class="ic-wrap"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span><span class="lbl">Settings</span></button>
</nav>
<div class="side-foot"><div class="sync-line"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Offline</span></div><div id="sideUser"></div></div>
</aside>
<div class="main">
<header class="topbar"><div class="top-titles"><span class="top-date" id="topDate"></span><h1 id="topTitle">Today</h1></div><div class="top-actions" id="topActions"></div><div class="acct-wrap"><button type="button" class="avatar" id="acctBtn" aria-label="Account" aria-haspopup="true">?</button><div class="acct-menu" id="acctMenu"></div></div></header>
<main class="content">
<section class="view active" id="v-runs"><div id="runsBody"></div></section>
<section class="view" id="v-analytics"><div id="analyticsBody"></div></section>
<section class="view" id="v-goals"><div id="goalsBody"></div></section>
<section class="view" id="v-trackers"><div id="trackersBody"></div></section>
<section class="view" id="v-quicklog"><div id="quickBody"></div></section>
<section class="view" id="v-settings"><div id="settingsBody"></div></section>
<section class="view" id="v-editor"><div id="editorBody"></div></section>
</main>
</div>
</div>
<div class="login-wrap" id="loginWrap" style="display:none">
<div class="login-card">
<div class="brand"><img class="brand-mark" src="icon-192.png" alt=""><h1>Rabit</h1></div>
<div class="sub" id="loginSub">Sign in to sync your runs across devices.</div>
<form id="loginForm" autocomplete="on">
<label class="field-label" for="loginUser">Username</label>
<input class="field" id="loginUser" name="username" autocomplete="username" placeholder="you@example.com">
<label class="field-label" for="loginPass">Password</label>
<input class="field" id="loginPass" type="password" name="password" autocomplete="current-password" placeholder="Your password">
<div id="confirmWrap" style="display:none"><label class="field-label" for="loginPass2">Repeat password</label>
<input class="field" id="loginPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
<div class="login-error" id="loginError" role="alert"></div>
<button class="build-button" type="submit" id="loginBtn">Sign in</button>
</form>
<button class="login-switch" type="button" id="loginSwitch">New here? Create an account</button>
<div class="login-hint">Your data stays on your own sync server.</div>
</div>
</div>
<section id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden>
<div class="welcome-panel">
<div class="welcome-brand"><img class="brand-mark" src="icon-192.png" alt=""><span>RABIT</span></div>
<div id="welcomeContent" class="welcome-content"></div>
<div class="welcome-nav"><button class="btn" type="button" id="welcomeBack">Skip</button><div id="welcomeDots" class="welcome-dots" aria-live="polite"></div><button class="build-button" type="button" id="welcomeNext">Next</button></div>
</div>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
