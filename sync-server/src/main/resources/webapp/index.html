<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Lab</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="tip" role="tooltip"></div>
<div class="desk" id="desk" style="display:none">
<aside class="side">
<div class="brand"><div class="brand-mark">H</div><div><b>Habit Lab</b><small id="brandSub">Desktop</small></div></div>
<nav class="sidenav" aria-label="Main navigation">
<button class="active" data-view="runs"><span class="ic">◷</span><span class="lbl">Runs &amp; Habits</span></button>
<button data-view="analytics" hidden><span class="ic">▥</span><span class="lbl">Analytics</span></button>
<button data-view="goals"><span class="ic">◎</span><span class="lbl">Goals</span></button>
<button data-view="trackers" hidden><span class="ic">⌁</span><span class="lbl">Trackers</span></button>
<button data-view="quicklog" hidden><span class="ic">⇆</span><span class="lbl">Quick Log</span></button>
</nav>
<div class="side-foot"><div class="sync-line"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Offline</span></div><div id="sideUser"></div></div>
</aside>
<div class="main">
<header class="topbar"><h1 id="topTitle">Runs &amp; Habits</h1><div class="acct-wrap"><button class="avatar" id="acctBtn" aria-label="Account">?</button><div class="acct-menu" id="acctMenu"></div></div></header>
<main class="content">
<section class="view active" id="v-runs"><div id="runsBody"></div></section>
<section class="view" id="v-analytics"><div id="analyticsBody"></div></section>
<section class="view" id="v-goals"><div id="goalsBody"></div></section>
<section class="view" id="v-trackers"><div id="trackersBody"></div></section>
<section class="view" id="v-quicklog"><div id="quickBody"></div></section>
<section class="view" id="v-builder"><div id="builderBody"></div></section>
<section class="view" id="v-edit"><div id="editBody"></div></section>
</main>
</div>
</div>
<div class="login-wrap" id="loginWrap" style="display:none">
<div class="login-card">
<div class="brand"><div class="brand-mark">H</div><h1>Habit Lab</h1></div>
<div class="sub" id="loginSub">Sign in to sync your runs across devices.</div>
<form id="loginForm" autocomplete="on">
<label class="field-label" for="loginUser">Username</label>
<input class="field" id="loginUser" name="username" autocomplete="username" placeholder="you@example.com">
<label class="field-label" for="loginPass">Password</label>
<input class="field" id="loginPass" type="password" name="password" autocomplete="current-password" placeholder="Your password">
<div id="confirmWrap" style="display:none"><label class="field-label" for="loginPass2">Repeat password</label>
<input class="field" id="loginPass2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
<div class="login-error" id="loginError" role="alert"></div>
<button class="build-button" type="submit" id="loginBtn">Sign in</button>
</form>
<button class="login-switch" type="button" id="loginSwitch">New here? Create an account</button>
<div class="login-hint">Your data stays on your own sync server.</div>
</div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
